[project]
name = "multiobjectivesurrogateoptimization"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Frithjof Gressmann", email = "fg14@illinois.edu" }
]
dependencies = [
    "dmosopt @ git+https://github.com/iraikov/dmosopt.git",
    "miv-simulator @ git+https://github.com/GazzolaLab/MiV-Simulator",
    "machinable>=4.10.3",
    "tensorflow==2.16.2",
    "tensorflow-probability==0.24",
    "matplotlib>=3.9.2",
    "seaborn>=0.13.2",
    "pandas>=2.2.2",
    "rich>=13.8.0",
    "pysqlite3-binary>=0.5.3.post1",
    "uncertainties>=3.2.2",
    "globus-sdk>=3.44.0",
    "nds @ git+https://github.com/KernelA/nds-py.git",
    "jupyter>=1.1.1",
]
readme = "README.md"
requires-python = ">= 3.9"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "ruff>=0.6.9",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/multiobjectivesurrogateoptimization"]
