[project]
name = "multiobjectivesurrogateoptimization"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Frithjof Gressmann", email = "fg14@illinois.edu" }
]
dependencies = [
    "dmosopt @ git+https://github.com/iraikov/dmosopt.git",
    "miv-simulator @ git+https://github.com/GazzolaLab/MiV-Simulator",
    "machinable==4.10.6",
    "matplotlib>=3.9.2",
    "seaborn>=0.13.2",
    "pandas>=2.2.2",
    "rich>=13.8.0",
    "uncertainties>=3.2.2",
    "globus-sdk>=3.44.0",
    "nds @ git+https://github.com/KernelA/nds-py.git",
    "jupyter>=1.1.1",
    "omegaconf==2.4.0.dev3",
    "torch>=2.5.1",
    "tensorflow==2.16.2",
    "gpytorch>=1.13",
    "scienceplots>=2.1.1",
    "tabulate>=0.9.0",
]
readme = "README.md"
requires-python = ">= 3.9"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "ruff>=0.6.9",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [  { index = "pytorch-cpu", marker = "platform_system != 'Darwin'"},]
torchvision = [{ index = "pytorch-cpu", marker = "platform_system != 'Darwin'"},]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/multiobjectivesurrogateoptimization"]
